spring.application.name=order-service

server.port=8082
#server.port=8091

#user-service.base-url=http://localhost:8081
#user-service.base-url=http://USER-SERVICE

#payment-service.base-url=http://PAYMENT-SERVICE

payment-service.base-url=http://localhost:8083

# Circuit Breaker - User Service
resilience4j.circuitbreaker.instances.userService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=4
resilience4j.circuitbreaker.instances.userService.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userService.permittedNumberOfCallsInHalfOpenState=2

# Slow Call Configuration
resilience4j.circuitbreaker.instances.userService.slowCallRateThreshold=100
resilience4j.circuitbreaker.instances.userService.slowCallDurationThreshold=3s

# Retry
#resilience4j.retry.instances.userService.max-attempts=3
resilience4j.retry.instances.userService.maxAttempts=3
resilience4j.retry.instances.userService.waitDuration=1s
#resilience4j.retry.instances.userService.enableExponentialBackoff=true
#resilience4j.retry.instances.userService.exponentialBackoffMultiplier=2
#resilience4j.retry.instances.userService.wait-duration=1s
#resilience4j.retry.instances.userService.enable-exponential-backoff=true
#resilience4j.retry.instances.userService.exponential-backoff-multiplier=2

# Bulkhead
resilience4j.bulkhead.instances.userService.maxConcurrentCalls=2
resilience4j.bulkhead.instances.userService.maxWaitDuration=0

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Feign Circuit Breaker
#spring.cloud.openfeign.circuitbreaker.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
